<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4A141C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bugatti Café">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bugatti Café – Faturação</title>
<style>
:root{
  --wine:#6B1F2A; --wine-d:#4A141C; --wine-l:#8A2E3B;
  --gold:#D4AF5A; --gold-d:#A8812F;
  --ink:#2A1B1E; --muted:#7A6A6C; --paper:#F7F2EA; --card:#FFFFFF; --line:#EADFCF; --inp:#FBF8F2;
  --accent:#6B1F2A; --onink:#fff; --red:#B3261E; --shadow:0 1px 2px rgba(74,20,28,.06),0 4px 14px rgba(74,20,28,.07);
  --serif:Georgia,"Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F4EBE6; --muted:#B5A3A5; --paper:#171012; --card:#241A1D; --line:#3A2A2E; --inp:#1B1315;
  --accent:#E7A3AC; --gold-d:#D4AF5A; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(32px + var(--safe-b));font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto}

/* ---------- cabeçalho ---------- */
header{background:linear-gradient(165deg,var(--wine) 0%,var(--wine-d) 100%);color:#fff;
  padding:calc(20px + var(--safe-t)) 20px 24px;text-align:center;
  border-radius:0 0 30px 30px;border-bottom:3px solid var(--gold);box-shadow:0 8px 24px rgba(74,20,28,.25)}
.logo{background:#fff;border-radius:16px;padding:5px;width:min(270px,74%);margin:0 auto;
  box-shadow:0 8px 22px rgba(0,0,0,.35),0 0 0 2px rgba(212,175,90,.55)}
.logo img{display:block;width:100%;height:auto;border-radius:11px}
.tag{margin-top:12px;font:italic 15px var(--serif);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);opacity:.95}
.yearnav{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 2px}
.yearnav button{width:44px;height:44px;border:1px solid rgba(255,255,255,.22);border-radius:50%;
  background:rgba(255,255,255,.1);color:#fff;font-size:24px;line-height:1;cursor:pointer;transition:background .15s}
.yearnav button:active{background:rgba(255,255,255,.25)}
.yearnav button:focus-visible,.tabs button:focus-visible,.yr:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.yearnav h1{margin:0;font:700 28px var(--serif);min-width:100px;text-align:center;letter-spacing:.02em}
.big{font:700 clamp(40px,13vw,56px)/1.05 var(--serif);letter-spacing:-.01em;color:#F3D893;margin-top:6px}
.sub{font-size:14px;opacity:.8;margin-top:4px}

/* ---------- separadores ---------- */
.tabs{position:sticky;top:var(--safe-t);z-index:5;padding:14px 16px 8px;display:flex;gap:6px;
  background:linear-gradient(var(--paper) 78%,transparent)}
.tabs button{flex:1;height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:22px;
  font:600 15px inherit;font-family:inherit;color:var(--muted);cursor:pointer;transition:all .15s}
.tabs button.on{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:0 3px 10px rgba(107,31,42,.3)}

/* ---------- semanas ---------- */
main{padding:0 16px}
.month{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px;
  padding-bottom:7px;border-bottom:2px solid var(--gold)}
.month h2{margin:0;font:700 21px var(--serif);color:var(--accent)}
.month small{font:400 13px system-ui,sans-serif;color:var(--muted);margin-left:8px}
.month .ms{font:700 18px var(--serif)}
.wk{display:grid;grid-template-columns:50px 1fr 112px;gap:12px;align-items:center;
  background:var(--card);border-radius:16px;padding:11px 12px;margin-bottom:9px;
  border:2px solid transparent;box-shadow:var(--shadow)}
.wk.now{border-color:var(--gold)}
.wk.now .range::after{content:" · atual";color:var(--gold-d);font-weight:700;font-size:12px}
.wn{text-align:center;line-height:1;background:var(--paper);color:var(--muted);border-radius:12px;padding:9px 0 8px;transition:all .2s}
.wn b{display:block;font:700 22px var(--serif)}
.wn span{font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.wk.filled .wn{background:var(--wine);color:#fff}
.range{font-weight:600;font-size:15px}
.days{display:flex;gap:3px;margin-top:6px}
.days i{font-style:normal;flex:1;max-width:26px;text-align:center;font-size:12px;line-height:1.15;color:var(--ink);
  border-radius:7px;padding:3px 0}
.days i small{display:block;font-size:10px;color:var(--muted)}
.days i.dim{opacity:.35}
.days i.today{background:var(--gold);color:#3A2A00;font-weight:700}
.days i.today small{color:#5A4300}
.amt{position:relative;display:block}
.amt input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--inp);
  font:700 17px inherit;font-family:inherit;text-align:right;padding:0 28px 0 8px;color:var(--ink)}
.amt input:focus{outline:none;border-color:var(--wine-l);background:var(--card);box-shadow:0 0 0 3px rgba(138,46,59,.2)}
.amt input.err{border-color:var(--red)}
.amt span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}

/* ---------- resumo ---------- */
.card{background:var(--card);border-radius:16px;padding:6px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:1fr auto;gap:5px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{font-weight:700}
.bar{grid-column:1/-1;height:7px;border-radius:4px;background:var(--paper);overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,var(--wine),var(--gold));border-radius:4px;transition:width .3s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 4px}
.stats div{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--gold)}
.stats b{display:block;font:700 22px var(--serif)}
.stats span{font-size:13px;color:var(--muted)}
h3{margin:28px 4px 10px;font:700 18px var(--serif);color:var(--accent)}
.yr{color:var(--ink);display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;background:var(--card);
  border:2px solid transparent;border-radius:16px;padding:14px 16px;margin-bottom:9px;font:inherit;cursor:pointer;
  min-height:50px;box-shadow:var(--shadow)}
.yr.on{border-color:var(--gold)}
.yr b{font-weight:700}
.backup{padding:14px 16px 16px}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;background:var(--inp);color:var(--ink);
  font:12px/1.4 ui-monospace,monospace;padding:9px;margin:6px 0}
.btn{height:46px;border:0;border-radius:23px;background:var(--wine);color:#fff;font:600 15px inherit;font-family:inherit;
  padding:0 22px;cursor:pointer;box-shadow:0 3px 10px rgba(107,31,42,.25)}
.btn:active{background:var(--wine-d)}
.btn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
.help{font-size:13px;color:var(--muted);margin:2px 0}
footer{text-align:center;margin:34px 16px 6px;font:italic 14px var(--serif);color:var(--muted)}
footer::before{content:"";display:block;width:56px;height:2px;background:var(--gold);margin:0 auto 12px;border-radius:1px}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translate(-50%,20px);opacity:0;
  background:var(--wine-d);color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;transition:.2s;pointer-events:none;
  max-width:90vw;text-align:center;border:1px solid var(--gold);box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red);border-color:var(--red)}
@media (prefers-reduced-motion:reduce){#toast,.bar div,.wn,.tabs button{transition:none}}
</style>
</head>

<script>
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIA=['S','T','Q','Q','S','S','D'];
const DAY=864e5;
const eur=new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'});
const $=s=>document.querySelector(s);
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let data={}, year, view='sem', first=true;

// ---- calendário (semanas ISO: segunda a domingo) ----
const mon1=y=>{const j=new Date(Date.UTC(y,0,4));return new Date(j-((j.getUTCDay()+6)%7)*DAY)};
const weeksIn=y=>Math.floor((Date.UTC(y,11,28)-mon1(y))/DAY/7)+1;
const monday=(y,w)=>new Date(+mon1(y)+(w-1)*7*DAY);
const monthOf=(y,w)=>new Date(+monday(y,w)+3*DAY).getUTCMonth(); // a semana conta no mês da sua quinta-feira
function todayInfo(){
  const n=new Date(), t=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));
  const th=new Date(+t+(3-((t.getUTCDay()+6)%7))*DAY), y=th.getUTCFullYear();
  return {t:+t,y,w:Math.floor((th-mon1(y))/DAY/7)+1};
}
const TODAY=todayInfo();

// ---- dados ----
const val=(y,w)=>data[y]?.[w]?.value ?? null;
const sum=(y,m)=>{let s=0;for(let w=1;w<=weeksIn(y);w++){if(m!=null&&monthOf(y,w)!==m)continue;s+=val(y,w)||0}return s};
const filled=y=>Object.keys(data[y]||{}).length;
const fmt=n=>n==null?'':n.toFixed(2).replace('.',',');

function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='show'+(bad?' bad':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='',2200)}

function showSave(){}
function restore(txt){try{const d=JSON.parse(txt);if(typeof d!=='object'||Array.isArray(d)||!d)throw 0;
  if(!confirm('Substituir todos os dados deste telemóvel pela cópia?'))return;data=d;persist();render();toast('Restaurado')}catch{toast('Ficheiro ou texto inválido',true)}}
const KEY='bugatti-faturacao';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{return false}}
async function load(){
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{data={}}
  year=TODAY.y; render();
}

// ---- vistas ----
function weekCard(y,w){
  const mon=monday(y,w), m=monthOf(y,w);
  const end=new Date(+mon+6*DAY), a=mon.getUTCMonth(), b=end.getUTCMonth();
  const range=a===b?`${mon.getUTCDate()} – ${end.getUTCDate()} ${MS[b]}`:`${mon.getUTCDate()} ${MS[a]} – ${end.getUTCDate()} ${MS[b]}`;
  let days='';
  for(let i=0;i<7;i++){
    const d=new Date(+mon+i*DAY);
    days+=`<i class="${d.getUTCMonth()!==m?'dim':''} ${+d===TODAY.t?'today':''}"><small>${DIA[i]}</small>${d.getUTCDate()}</i>`;
  }
  const now=(y===TODAY.y&&w===TODAY.w), has=val(y,w)!=null;
  return `<div class="wk${now?' now':''}${has?' filled':''}"><div class="wn"><b>${w}</b><span>semana</span></div>
    <div><div class="range">${range}</div><div class="days">${days}</div></div>
    <label class="amt"><input inputmode="decimal" data-w="${w}" placeholder="0,00" aria-label="Faturação da semana ${w}" value="${fmt(val(y,w))}"><span>€</span></label></div>`;
}

function render(){
  $('#year').textContent=year;
  $('#t-sem').classList.toggle('on',view==='sem');
  $('#t-res').classList.toggle('on',view==='res');
  let h='';
  if(view==='sem'){
    let cur=-1;
    for(let w=1;w<=weeksIn(year);w++){
      const m=monthOf(year,w);
      if(m!==cur){
        if(cur!==-1)h+='</section>';
        cur=m;
        const n=[...Array(weeksIn(year)).keys()].filter(i=>monthOf(year,i+1)===m).length;
        h+=`<section><div class="month"><h2>${MESES[m]}<small>${n} semanas</small></h2><span class="ms" id="m${m}"></span></div>`;
      }
      h+=weekCard(year,w);
    }
    h+='</section>';
  }else{
    const max=Math.max(1,...MESES.map((_,m)=>sum(year,m)));
    h+=`<div class="stats"><div><b id="st1"></b><span>Semanas preenchidas</span></div><div><b id="st2"></b><span>Média por semana</span></div></div>`;
    h+=`<h3>Meses de ${year}</h3><div class="card">`+MESES.map((n,m)=>{const s=sum(year,m);
      return `<div class="row"><span>${n}</span><b>${eur.format(s)}</b><div class="bar"><div style="width:${s/max*100}%"></div></div></div>`}).join('')+`</div>`;
    const ys=[...new Set([...Object.keys(data).map(Number),year,TODAY.y])].sort((a,b)=>b-a);
    h+=`<h3>Todos os anos</h3>`+ys.map(y=>`<button class="yr${y===year?' on':''}" data-y="${y}"><span>${y}</span><b>${eur.format(sum(y))}</b></button>`).join('');
    h+=`<h3>Cópia de segurança</h3><div class="card backup"><p class="help">Os dados ficam só neste telemóvel. Guarda um ficheiro de vez em quando (no iPhone escolhe “Guardar em Ficheiros” ou OneDrive; no Android e no PC o ficheiro vai para as Transferências).</p>
      <button class="btn" id="sv">Guardar ficheiro</button>
      <p class="help" style="margin-top:16px">Ou copia o texto e guarda-o nas notas:</p>
      <textarea id="bk" readonly>${JSON.stringify(data)}</textarea><button class="btn alt" id="cp">Copiar</button>
      <p class="help" style="margin-top:16px">Para restaurar, escolhe o ficheiro guardado:</p>
      <input type="file" id="rf" accept=".json,application/json" style="margin:6px 0 10px;max-width:100%;color:var(--ink)">
      <p class="help">ou cola aqui o texto da cópia:</p>
      <textarea id="rs" placeholder="Cola aqui a cópia"></textarea><button class="btn alt" id="rb">Restaurar</button></div>`;
  }
  $('#main').innerHTML=h;
  totals();showSave();
  if(view==='sem'&&first&&year===TODAY.y){first=false;setTimeout(()=>document.querySelector('.now')?.scrollIntoView({block:'center'}),50)}
}

function totals(){
  $('#total').textContent=eur.format(sum(year));
  $('#sub').textContent=`Total de ${year}`+(filled(year)?` (${filled(year)} de ${weeksIn(year)} semanas)`:'');
  for(let m=0;m<12;m++){const e=$('#m'+m);if(e)e.textContent=eur.format(sum(year,m))}
  if($('#st1')){$('#st1').textContent=`${filled(year)} de ${weeksIn(year)}`;$('#st2').textContent=filled(year)?eur.format(sum(year)/filled(year)):'–'}
}

// ---- guardar ficheiro ----
// iPhone/iPad: folha de partilha (Guardar em Ficheiros / OneDrive).
// Android e PC: descarregamento normal para a pasta Transferências.
async function guardarFicheiro(){
  const n=new Date(),p=x=>String(x).padStart(2,'0');
  const name=`bugatti-cafe-${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}.json`;
  const texto=JSON.stringify(data,null,2);
  const f=new File([texto],name,{type:'application/json'});
  const descarregar=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([texto],{type:'application/json'}));
    a.download=name;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
    toast('Ficheiro descarregado: '+name);
  };
  try{
    if(isIOS&&navigator.canShare?.({files:[f]})){
      try{await navigator.share({files:[f],title:name});toast('Ficheiro partilhado')}
      catch(er){if(er?.name==='AbortError')return;descarregar()}
    }else descarregar();
  }catch(err){
    toast('Não foi possível guardar. Usa o botão Copiar.',true);
  }
}

// ---- eventos ----
$('#prev').onclick=()=>{year--;render()};
$('#next').onclick=()=>{year++;render()};
$('#t-sem').onclick=()=>{view='sem';render();scrollTo(0,0)};
$('#t-res').onclick=()=>{view='res';render();scrollTo(0,0)};
$('#main').addEventListener('click',e=>{const b=e.target.closest('.yr');if(b){year=+b.dataset.y;view='sem';first=false;render();scrollTo(0,0)}});
$('#main').addEventListener('click',async e=>{
  if(e.target.id==='cp'){const t=$('#bk');t.select();try{await navigator.clipboard.writeText(t.value)}catch{document.execCommand('copy')}toast('Copiado')}
  if(e.target.id==='rb')restore($('#rs').value);
  if(e.target.id==='sv')guardarFicheiro();
});
$('#main').addEventListener('change',e=>{if(e.target.id!=='rf'||!e.target.files[0])return;
  const r=new FileReader();r.onload=()=>restore(String(r.result));r.readAsText(e.target.files[0]);e.target.value=''});
$('#main').addEventListener('focusin',e=>{if(e.target.matches('.amt input'))setTimeout(()=>e.target.select(),0)});
$('#main').addEventListener('change',async e=>{
  const i=e.target; if(!i.matches('.amt input'))return;
  const w=+i.dataset.w, txt=i.value.trim().replace(/\s/g,'').replace(',','.');
  let n=null;
  if(txt!==''){n=Math.round(parseFloat(txt)*100)/100;if(!Number.isFinite(n)){i.classList.add('err');toast('Escreve só números, por exemplo 1250,50',true);return}}
  i.classList.remove('err');
  if(n===null){if(data[year]){delete data[year][w];if(!Object.keys(data[year]).length)delete data[year]}}
  else{(data[year] ||= {})[w]={value:n}}
  i.value=fmt(n); i.closest('.wk')?.classList.toggle('filled',n!==null); totals();
  if(persist())toast(n===null?'Semana limpa':'Guardado');
  else{i.classList.add('err');toast('Não foi possível guardar neste browser',true)}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
navigator.storage?.persist?.();
load();
</script>
