<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14308F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bugatti Café">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bugatti Café – Faturação</title>
<style>
:root{
  --blue:#14308F; --blue-d:#0D2068; --ink:#161A26; --muted:#667089;
  --paper:#EDF0F6; --card:#fff; --line:#DCE1EC; --gold:#F0B429; --red:#C0392B;
  --inp:#F7F8FC; --onink:#fff; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EEF1F8;--muted:#9AA4BD;--paper:#0F1320;--card:#1A2033;--line:#2B3350;--inp:#121728;--onink:#0F1320}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(32px + var(--safe-b));font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto}
header{background:var(--blue);color:#fff;padding:calc(18px + var(--safe-t)) 20px 22px}
.brand{display:flex;justify-content:space-between;align-items:baseline}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:14px;opacity:.75}
.yearnav{display:flex;align-items:center;gap:6px;margin:16px 0 4px}
.yearnav button{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.14);
  color:#fff;font-size:24px;line-height:1;cursor:pointer}
.yearnav button:focus-visible,.tabs button:focus-visible,.yr:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.yearnav h1{margin:0;font-size:22px;font-weight:700;min-width:84px;text-align:center}
.big{font-size:clamp(40px,13vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--gold)}
.sub{font-size:14px;opacity:.8;margin-top:4px}
.tabs{position:sticky;top:var(--safe-t);z-index:5;background:var(--paper);padding:12px 16px 8px;display:flex;gap:8px}
.tabs button{flex:1;height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;
  font:600 15px inherit;font-family:inherit;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--onink)}
main{padding:0 16px}
.month{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px;
  padding-bottom:6px;border-bottom:2px solid var(--blue)}
.month h2{margin:0;font-size:18px;font-weight:800;color:var(--blue)}
@media (prefers-color-scheme:dark){.month h2{color:#8FA6F5}.bar div{background:#6F8CF0}}
.month small{color:var(--muted);font-size:13px;margin-left:8px;font-weight:400}
.month .ms{font-weight:800;font-size:18px}
.wk{display:grid;grid-template-columns:46px 1fr 104px;gap:10px;align-items:center;
  background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;border:2px solid transparent}
.wk.now{border-color:var(--gold)}
.wn{text-align:center;line-height:1}
.wn b{display:block;font-size:24px;font-weight:800}
.wn span{font-size:11px;color:var(--muted)}
.range{font-weight:600;font-size:15px}
.days{display:flex;gap:2px;margin-top:5px}
.days i{font-style:normal;flex:1;max-width:24px;text-align:center;font-size:12px;line-height:1.15;color:var(--ink);
  border-radius:6px;padding:2px 0}
.days i small{display:block;font-size:10px;color:var(--muted)}
.days i.dim{opacity:.38}
.days i.today{background:var(--gold);font-weight:700}
.amt{position:relative;display:block}
.amt input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--inp);
  font:700 17px inherit;font-family:inherit;text-align:right;padding:0 28px 0 8px;color:var(--ink)}
.amt input:focus{outline:none;border-color:#6F8CF0;background:var(--card);box-shadow:0 0 0 3px rgba(20,48,143,.18)}
.amt input.err{border-color:var(--red)}
.amt span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.card{background:var(--card);border-radius:14px;padding:6px 14px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{font-weight:700}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--paper);overflow:hidden}
.bar div{height:100%;background:var(--blue);border-radius:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.stats div{background:var(--card);border-radius:14px;padding:12px 14px}
.stats b{display:block;font-size:20px;font-weight:800}
.stats span{font-size:13px;color:var(--muted)}
h3{margin:24px 4px 8px;font-size:16px}
.yr{display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;background:var(--card);border:2px solid transparent;
  border-radius:14px;padding:14px;margin-bottom:8px;font:inherit;cursor:pointer;min-height:48px}
.yr.on{border-color:var(--blue)}
.yr b{font-weight:800}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:10px;background:var(--inp);color:var(--ink);font:12px/1.4 ui-monospace,monospace;padding:8px;margin:6px 0}
.btn{height:44px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:600 15px inherit;font-family:inherit;padding:0 16px;cursor:pointer}
.help{font-size:13px;color:var(--muted);margin:2px 4px}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--red)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>Bugatti Café</b><span>Faturação semanal</span></div>
    <div class="yearnav">
      <button id="prev" aria-label="Ano anterior">‹</button>
      <h1 id="year"></h1>
      <button id="next" aria-label="Ano seguinte">›</button>
    </div>
    <div class="big" id="total"></div>
    <div class="sub" id="sub"></div>
  </header>
  <nav class="tabs">
    <button id="t-sem" class="on">Semanas</button>
    <button id="t-res">Resumo</button>
  </nav>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>

<script>
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIA=['S','T','Q','Q','S','S','D'];
const DAY=864e5;
const eur=new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'});
const $=s=>document.querySelector(s);
let data={}, year, view='sem', first=true;

// ---- calendário (semanas ISO: segunda a domingo) ----
const mon1=y=>{const j=new Date(Date.UTC(y,0,4));return new Date(j-((j.getUTCDay()+6)%7)*DAY)};
const weeksIn=y=>Math.floor((Date.UTC(y,11,28)-mon1(y))/DAY/7)+1;
const monday=(y,w)=>new Date(+mon1(y)+(w-1)*7*DAY);
const monthOf=(y,w)=>new Date(+monday(y,w)+3*DAY).getUTCMonth(); // a semana conta no mês da sua quinta-feira
function todayInfo(){
  const n=new Date(), t=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));
  const th=new Date(+t+(3-((t.getUTCDay()+6)%7))*DAY), y=th.getUTCFullYear();
  return {t:+t,y,w:Math.floor((th-mon1(y))/DAY/7)+1};
}
const TODAY=todayInfo();

// ---- dados ----
const val=(y,w)=>data[y]?.[w]?.value ?? null;
const sum=(y,m)=>{let s=0;for(let w=1;w<=weeksIn(y);w++){if(m!=null&&monthOf(y,w)!==m)continue;s+=val(y,w)||0}return s};
const filled=y=>Object.keys(data[y]||{}).length;
const fmt=n=>n==null?'':n.toFixed(2).replace('.',',');

function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='show'+(bad?' bad':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='',1800)}

function showSave(){}
function restore(txt){try{const d=JSON.parse(txt);if(typeof d!=='object'||Array.isArray(d)||!d)throw 0;
  if(!confirm('Substituir todos os dados deste telemóvel pela cópia?'))return;data=d;persist();render();toast('Restaurado')}catch{toast('Ficheiro ou texto inválido',true)}}
const KEY='bugatti-faturacao';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{return false}}
async function load(){
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{data={}}
  year=TODAY.y; render();
}

// ---- vistas ----
function weekCard(y,w){
  const mon=monday(y,w), m=monthOf(y,w);
  const end=new Date(+mon+6*DAY), a=mon.getUTCMonth(), b=end.getUTCMonth();
  const range=a===b?`${mon.getUTCDate()} – ${end.getUTCDate()} ${MS[b]}`:`${mon.getUTCDate()} ${MS[a]} – ${end.getUTCDate()} ${MS[b]}`;
  let days='';
  for(let i=0;i<7;i++){
    const d=new Date(+mon+i*DAY);
    days+=`<i class="${d.getUTCMonth()!==m?'dim':''} ${+d===TODAY.t?'today':''}"><small>${DIA[i]}</small>${d.getUTCDate()}</i>`;
  }
  const now=(y===TODAY.y&&w===TODAY.w);
  return `<div class="wk${now?' now':''}"><div class="wn"><b>${w}</b><span>semana</span></div>
    <div><div class="range">${range}</div><div class="days">${days}</div></div>
    <label class="amt"><input inputmode="decimal" data-w="${w}" placeholder="0,00" aria-label="Faturação da semana ${w}" value="${fmt(val(y,w))}"><span>€</span></label></div>`;
}

function render(){
  $('#year').textContent=year;
  $('#t-sem').classList.toggle('on',view==='sem');
  $('#t-res').classList.toggle('on',view==='res');
  let h='';
  if(view==='sem'){
    let cur=-1;
    for(let w=1;w<=weeksIn(year);w++){
      const m=monthOf(year,w);
      if(m!==cur){
        if(cur!==-1)h+='</section>';
        cur=m;
        const n=[...Array(weeksIn(year)).keys()].filter(i=>monthOf(year,i+1)===m).length;
        h+=`<section><div class="month"><h2>${MESES[m]}<small>${n} semanas</small></h2><span class="ms" id="m${m}"></span></div>`;
      }
      h+=weekCard(year,w);
    }
    h+='</section>';
  }else{
    const max=Math.max(1,...MESES.map((_,m)=>sum(year,m)));
    h+=`<div class="stats"><div><b id="st1"></b><span>Semanas preenchidas</span></div><div><b id="st2"></b><span>Média por semana</span></div></div>`;
    h+=`<h3>Meses de ${year}</h3><div class="card">`+MESES.map((n,m)=>{const s=sum(year,m);
      return `<div class="row"><span>${n}</span><b>${eur.format(s)}</b><div class="bar"><div style="width:${s/max*100}%"></div></div></div>`}).join('')+`</div>`;
    const ys=[...new Set([...Object.keys(data).map(Number),year,TODAY.y])].sort((a,b)=>b-a);
    h+=`<h3>Todos os anos</h3>`+ys.map(y=>`<button class="yr${y===year?' on':''}" data-y="${y}"><span>${y}</span><b>${eur.format(sum(y))}</b></button>`).join('');
    h+=`<h3>Cópia de segurança</h3><p class="help">Os dados ficam só neste telemóvel. Guarda um ficheiro de vez em quando (no iPhone escolhe “Guardar em Ficheiros” ou OneDrive).</p>
      <button class="btn" id="sv">Guardar ficheiro</button>
      <p class="help" style="margin-top:14px">Ou copia o texto e guarda-o nas notas:</p>
      <textarea id="bk" readonly>${JSON.stringify(data)}</textarea><button class="btn" id="cp">Copiar</button>
      <p class="help" style="margin-top:14px">Para restaurar, escolhe o ficheiro guardado:</p>
      <input type="file" id="rf" accept=".json,application/json" style="margin:6px 0 10px;max-width:100%">
      <p class="help">ou cola aqui o texto da cópia:</p>
      <textarea id="rs" placeholder="Cola aqui a cópia"></textarea><button class="btn" id="rb">Restaurar</button>`;
  }
  $('#main').innerHTML=h;
  totals();showSave();
  if(view==='sem'&&first&&year===TODAY.y){first=false;setTimeout(()=>document.querySelector('.now')?.scrollIntoView({block:'center'}),50)}
}

function totals(){
  $('#total').textContent=eur.format(sum(year));
  $('#sub').textContent=`Total de ${year}`+(filled(year)?` (${filled(year)} de ${weeksIn(year)} semanas)`:'');
  for(let m=0;m<12;m++){const e=$('#m'+m);if(e)e.textContent=eur.format(sum(year,m))}
  if($('#st1')){$('#st1').textContent=`${filled(year)} de ${weeksIn(year)}`;$('#st2').textContent=filled(year)?eur.format(sum(year)/filled(year)):'–'}
}

// ---- eventos ----
$('#prev').onclick=()=>{year--;render()};
$('#next').onclick=()=>{year++;render()};
$('#t-sem').onclick=()=>{view='sem';render();scrollTo(0,0)};
$('#t-res').onclick=()=>{view='res';render();scrollTo(0,0)};
$('#main').addEventListener('click',e=>{const b=e.target.closest('.yr');if(b){year=+b.dataset.y;view='sem';first=false;render();scrollTo(0,0)}});
$('#main').addEventListener('click',async e=>{
  if(e.target.id==='cp'){const t=$('#bk');t.select();try{await navigator.clipboard.writeText(t.value)}catch{document.execCommand('copy')}toast('Copiado')}
  if(e.target.id==='rb')restore($('#rs').value);
  if(e.target.id==='sv'){const n=new Date(),p=x=>String(x).padStart(2,'0');
    const name=`bugatti-cafe-${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}.json`;
    const f=new File([JSON.stringify(data,null,2)],name,{type:'application/json'});
    try{
      if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],title:name});toast('Ficheiro partilhado')}
      else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Ficheiro guardado em Transferências')}
    }catch(err){if(err?.name!=='AbortError')toast('Não foi possível guardar o ficheiro',true)}}
});
$('#main').addEventListener('change',e=>{if(e.target.id!=='rf'||!e.target.files[0])return;
  const r=new FileReader();r.onload=()=>restore(String(r.result));r.readAsText(e.target.files[0]);e.target.value=''});
$('#main').addEventListener('focusin',e=>{if(e.target.matches('.amt input'))setTimeout(()=>e.target.select(),0)});
$('#main').addEventListener('change',async e=>{
  const i=e.target; if(!i.matches('.amt input'))return;
  const w=+i.dataset.w, txt=i.value.trim().replace(/\s/g,'').replace(',','.');
  let n=null;
  if(txt!==''){n=Math.round(parseFloat(txt)*100)/100;if(!Number.isFinite(n)){i.classList.add('err');toast('Escreve só números, por exemplo 1250,50',true);return}}
  i.classList.remove('err');
  const old=data[year]?.[w];
  if(n===null){if(data[year]){delete data[year][w];if(!Object.keys(data[year]).length)delete data[year]}}
  else{(data[year] ||= {})[w]={value:n}}
  i.value=fmt(n); totals();
  if(persist())toast(n===null?'Semana limpa':'Guardado');
  else{i.classList.add('err');toast('Não foi possível guardar neste browser',true)}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
navigator.storage?.persist?.();
load();
</script>
</body>
</html>
